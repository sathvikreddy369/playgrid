services:
  - type: web
    name: playgrid-api
    runtime: node
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma migrate deploy && npm run build

    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
